# Production-ish deployment: single unified Node service behind a Caddy
# reverse proxy that auto-provisions Let's Encrypt TLS for your domain.
#
#   https://${DOMAIN}        + https://cc.${DOMAIN}   -> Command Centre  (/  )
#   https://idd.${DOMAIN}                             -> IDD Production  (/idd)
#
# All apps served from one process (server.js) on port 3001.
# Identity is shared via the `state` volume (users.json, session tokens, SQLite DBs).
#
# Copy .env.deploy.example -> .env, fill it in, point DNS at the host, then:
#   docker compose up -d --build

# Fixed project name so the named volumes are predictable (klim_state, …) —
# the backup/restore runbook in DEPLOY.md refers to `klim_state`.
name: klim

services:
  app:
    build: .
    command: node server.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3001
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ALLOWED_ORIGINS: "https://${DOMAIN},https://cc.${DOMAIN},https://idd.${DOMAIN}"
      INTEGRATIONS_STRICT: ${INTEGRATIONS_STRICT:-1}
      # Vendor credentials (optional — left blank serves mock / not-configured).
      APS_CLIENT_ID: ${APS_CLIENT_ID:-}
      APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
      ACC_ACCOUNT_ID: ${ACC_ACCOUNT_ID:-}
      ACC_PROJECT_ID: ${ACC_PROJECT_ID:-}
      PBI_TENANT_ID: ${PBI_TENANT_ID:-}
      PBI_CLIENT_ID: ${PBI_CLIENT_ID:-}
      PBI_CLIENT_SECRET: ${PBI_CLIENT_SECRET:-}
      PBI_WORKSPACE_ID: ${PBI_WORKSPACE_ID:-}
      PBI_REPORT_ID: ${PBI_REPORT_ID:-}
      POWERBI_ALLOWED_REPORTS: ${POWERBI_ALLOWED_REPORTS:-}
      QSE_BASE_URL: ${QSE_BASE_URL:-}
      QSE_API_KEY: ${QSE_API_KEY:-}
      UNICON_BASE_URL: ${UNICON_BASE_URL:-}
      UNICON_API_KEY: ${UNICON_API_KEY:-}
      UNICON_COMPANY_ID: ${UNICON_COMPANY_ID:-}
    volumes:
      - state:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4@sha256:b95ed06fbc6d74d24a40902090c8cc6086ce7d08ba60a3a7e8e62bf164a9d7bb
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  state:
  caddy_data:
  caddy_config:
