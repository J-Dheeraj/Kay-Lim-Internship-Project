name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']   # the versions pinned in package.json engines
    steps:
      - uses: actions/checkout@v4
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check auth.js
          node --check idd_store.js
          node --check idd_production_server.js
          node --check acc_backend_server.js
      - run: npm test
      - name: Validate Docker Compose config
        run: SESSION_SECRET=ci ADMIN_PASSWORD=ci DOMAIN=example.com docker compose config -q
