name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Unit tests + syntax + compose validation ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']   # versions pinned in package.json engines
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check auth.js
          node --check idd_store.js
          node --check server.js
          node --check construction_dashboard.js
          node --check idd_production_app.js
      - run: npm test
      - name: Dependency audit (fail on high/critical CVEs)
        run: npm audit --audit-level=high
      - name: Validate Docker Compose config
        run: SESSION_SECRET=ci-placeholder-not-real ADMIN_PASSWORD=ci-placeholder DOMAIN=example.com docker compose config -q

  # ── Browser smoke tests (Playwright + Chromium) ───────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Generate ephemeral CI credentials
        run: |
          PW="$(openssl rand -hex 8)"
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$PW"                     >> "$GITHUB_ENV"
          echo "_SMOKE_PW=$PW"                          >> "$GITHUB_ENV"
          echo "_SMOKE_SECRET=$(openssl rand -hex 32)"  >> "$GITHUB_ENV"
          echo "_SMOKE_DATA=$(mktemp -d)"               >> "$GITHUB_ENV"
          echo "PORT=3001"                              >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Rebuild native modules for current Node
        run: npm rebuild better-sqlite3
      - name: Run Playwright smoke tests
        run: npm run smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # ── Secret / credential leak scan ─────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0   # full history so gitleaks catches past commits too
      - name: Gitleaks — scan for leaked credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Container build + vulnerability scan + SBOM ───────────────────────────
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Build container image
        run: docker build -t klim:ci .
      - name: Trivy — scan app libraries for HIGH/CRITICAL CVEs (fail on unfixed)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: klim:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Trivy — scan OS packages for HIGH/CRITICAL CVEs (report only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: klim:ci
          format: json
          output: trivy-os-findings.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
      - name: Upload OS CVE findings artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trivy-os-findings-${{ github.sha }}
          path: trivy-os-findings.json
          retention-days: 30
      - name: Trivy — generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: klim:ci
          format: cyclonedx
          output: sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
